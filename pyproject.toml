[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fittsguard"
version = "0.1.0"
description = "Fitts' law based macro / bot detection with an age-conditional human motor model"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
fittsguard = "fittsguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fittsguard = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
